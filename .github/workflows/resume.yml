name: Update Resume

on:
  push:
    branches: ["main"]
    paths:
      - "apps/resume/**"
      - ".github/workflows/resume.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/resume

permissions:
  contents: read

concurrency:
  group: resume-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - name: Install resume dependencies
        run: pnpm install --frozen-lockfile --filter @acme/resume...
      - name: Typecheck resume scripts
        run: pnpm typecheck
      - name: Test resume scripts
        run: pnpm test
      - name: Generate DOCX and PDF with containerized tools
        run: node src/convert.ts
      - name: Upload PDF and page previews
        uses: actions/upload-artifact@v7
        with:
          name: resume
          path: apps/resume/generated/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: resume-cms
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - name: Install publishing dependencies
        run: pnpm install --frozen-lockfile --prod --filter @acme/resume
      - uses: actions/download-artifact@v8
        with:
          name: resume
          path: apps/resume/generated/
      - name: Authenticate as the resume service account
        # Authentication runs after dependency installation and artifact download.
        # The SDK requests the Drive scope using the generated credentials file.
        # No OAuth client secret, refresh token, or service-account key is stored.
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
      - name: Publish existing PDF
        env:
          GOOGLE_DRIVE_FILE_ID: ${{ vars.GOOGLE_DRIVE_FILE_ID || '15bEpE77LztNaNu2fn2wRtPsXeKzHSCu9' }}
        run: node src/publish.ts
